name: Keep database awake

# Supabase pauses free projects after a week without activity, which would
# break the live demo. This pings the database twice a week so it stays on.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -a; . ./.env.production; set +a
          curl -sS "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/branches?select=id&limit=1" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" -o /dev/null -w "%{http_code}\n"
